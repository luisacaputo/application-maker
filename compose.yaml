services:
  api:
    build:
      context: ./Nodejs
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
    volumes:
      - generated-projects:/app/generated-projects
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5002/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3

  web:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  generated-projects:
